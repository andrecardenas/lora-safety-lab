apiVersion: apps/v1
kind: Deployment
metadata:
  name: reply-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reply-checker
  template:
    metadata:
      labels:
        app: reply-checker
    spec:
      containers:
        - name: reply-checker
          image: reply-checker:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reply-checker
spec:
  selector:
    app: reply-checker
  ports:
    - port: 80
      targetPort: 8080
